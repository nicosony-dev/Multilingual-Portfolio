<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Talk Time">
<meta name="theme-color" content="#fcba03">
<title>Talk Time</title>
<style>
  :root {
    --purple: #542a7d;
    --yellow: #fcba03;
    --white: #ffffff;
    --shadow: rgba(84, 42, 125, 0.45);
    --font: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    color: var(--purple);
    background: var(--yellow);
    padding: env(safe-area-inset-top, 0px) 20px env(safe-area-inset-bottom, 0px);
    -webkit-user-select: none; user-select: none;
  }
  main { max-width: 820px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 28px; padding: 20px 0; text-align: center; }
  .screen { display: none; width: 100%; flex-direction: column; align-items: center; gap: 28px; }
  .screen.active { display: flex; }

  h1 { font-size: clamp(36px, 7vw, 56px); margin: 0; line-height: 1.15; }
  p.sub { font-size: clamp(24px, 4vw, 32px); margin: 0; }

  /* name picker: very large targets with space between them */
  .names { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 22px; width: 100%; }
  .name {
    font: inherit; font-size: 32px; color: var(--purple);
    background: var(--white); border: 5px solid var(--purple); border-radius: 30px;
    min-height: 160px; padding: 12px; cursor: pointer;
    box-shadow: 0 8px 0 var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .name .face { font-size: 56px; line-height: 1; }
  .name:active { background: var(--purple); color: var(--white); transform: translateY(5px); box-shadow: 0 3px 0 var(--shadow); }

  /* prompt card */
  .prompt {
    background: var(--white); border: 5px solid var(--purple); border-radius: 32px;
    padding: 24px 28px; width: 100%; display: flex; align-items: center; gap: 22px; text-align: left;
  }
  .prompt .emoji { font-size: clamp(64px, 14vw, 104px); line-height: 1; }
  .prompt .text { font-size: clamp(28px, 5.4vw, 42px); line-height: 1.25; flex: 1; }

  /* buttons: at least 120px tall */
  button.big {
    font: inherit; font-size: clamp(30px, 5.5vw, 40px);
    border: 5px solid var(--purple); border-radius: 999px;
    min-height: 120px; min-width: 240px; padding: 0 48px; cursor: pointer;
    box-shadow: 0 8px 0 var(--shadow);
    display: inline-flex; align-items: center; justify-content: center; gap: 14px;
  }
  button.big:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--shadow); }
  button.big:disabled { opacity: 0.5; }
  .send { background: var(--purple); color: var(--white); }                       /* main action */
  .hear, .play, .retry { background: var(--white); color: var(--purple); }        /* helpers */
  .back { background: transparent; color: var(--purple); box-shadow: none; min-height: 88px; min-width: 160px; font-size: 28px; }

  /* the one memorable thing: the record button */
  .rec {
    width: clamp(240px, 56vw, 320px); aspect-ratio: 1; border-radius: 50%;
    border: 12px solid var(--white); background: var(--purple); color: var(--white);
    font: inherit; font-size: clamp(34px, 7vw, 46px);
    box-shadow: 0 0 0 6px var(--purple), 0 12px 0 6px var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
  }
  .rec .dot { width: 76px; height: 76px; border-radius: 50%; background: var(--white); }
  .rec.live { background: var(--white); color: var(--purple); animation: pulse 1.1s ease-in-out infinite; }
  .rec.live .dot { background: var(--purple); border-radius: 16px; width: 64px; height: 64px; }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { .rec.live { animation: none; } }

  .bar { width: 100%; height: 28px; background: var(--white); border: 5px solid var(--purple); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0%; background: var(--purple); transition: width 0.25s linear; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }

  .stars { font-size: clamp(72px, 18vw, 120px); letter-spacing: 8px; }
  .msg { font-size: 28px; max-width: 28ch; line-height: 1.3; }
  :focus-visible { outline: 6px solid var(--purple); outline-offset: 4px; }
</style>
</head>
<body>
<main>

  <!-- 0. loading -->
  <section id="s-loading" class="screen active">
    <h1>Getting ready…</h1>
  </section>

  <!-- 1. who are you -->
  <section id="s-names" class="screen">
    <h1>Tap your name</h1>
    <div id="names" class="names"></div>
  </section>

  <!-- 2. record -->
  <section id="s-record" class="screen">
    <div class="prompt">
      <div id="p-emoji" class="emoji"></div>
      <div id="p-text" class="text"></div>
    </div>
    <button id="btn-hear" class="big hear" aria-label="Hear the question">🔊 Hear it</button>
    <button id="btn-rec" class="rec" aria-label="Start recording">
      <span class="dot"></span><span id="rec-label">Record</span>
    </button>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <button id="btn-back1" class="big back">Back</button>
  </section>

  <!-- 3. listen and send -->
  <section id="s-review" class="screen">
    <h1>Listen to your voice</h1>
    <audio id="player" playsinline></audio>
    <button id="btn-play" class="big play">▶ Listen</button>
    <div class="row">
      <button id="btn-retry" class="big retry">↻ Try again</button>
      <button id="btn-send" class="big send">✔ Send</button>
    </div>
  </section>

  <!-- 4. sending -->
  <section id="s-sending" class="screen">
    <h1>Sending…</h1>
    <p class="sub">Please wait</p>
  </section>

  <!-- 5. done -->
  <section id="s-done" class="screen">
    <div class="stars">⭐⭐⭐</div>
    <h1 id="done-name">Great job!</h1>
  </section>

  <!-- error -->
  <section id="s-error" class="screen">
    <h1 id="err-title">Oops!</h1>
    <p id="err-msg" class="msg"></p>
    <button id="btn-err" class="big send">OK</button>
  </section>

</main>

<script>
(function () {
  // ===== Teacher: paste your Web app URL (ends in /exec) between the quotes =====
  var WEB_APP_URL = 'https://script.google.com/a/macros/district87.org/s/AKfycbxDeKitjUE1Sp9e6pPnM8oiGwedTo7oFXTo9r9Xg61z8RhOeYxFjFssMPNMh9r4Rzgxsw/exec';
  // Longest recording, in seconds
  var MAX_SECONDS = 60;
  // ==============================================================================

  var FACES = ['🦊','🐼','🐸','🦁','🐯','🐵','🐰','🐻','🐨','🐷','🐙','🦄','🐢','🦉','🐬','🦋','🐞','🐝'];
  var classCode = new URLSearchParams(location.search).get('c') || '';

  var $ = function (id) { return document.getElementById(id); };
  var screens = ['loading','names','record','review','sending','done','error'];
  function show(name) {
    screens.forEach(function (s) { $('s-' + s).classList.toggle('active', s === name); });
  }

  var state = { student: '', prompt: null, blob: null, mime: '', stream: null, recorder: null, chunks: [], tick: null, secs: 0, previewUrl: null };

  function fail(title, msg, backTo) {
    $('err-title').textContent = title;
    $('err-msg').textContent = msg;
    $('btn-err').onclick = function () { show(backTo || 'names'); };
    show('error');
  }

  /* ---------- load roster ---------- */
  function loadRoster() {
    show('loading');
    if (!classCode) return fail('Ask your teacher', 'This page needs a class link.', 'loading');
    fetch(WEB_APP_URL + '?action=roster&c=' + encodeURIComponent(classCode))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) return fail('Ask your teacher', 'This class link is not working.', 'loading');
        state.prompt = data.prompt;
        var box = $('names');
        box.innerHTML = '';
        data.students.forEach(function (name, i) {
          var b = document.createElement('button');
          b.className = 'name';
          var face = document.createElement('span');
          face.className = 'face';
          face.textContent = FACES[i % FACES.length];
          var label = document.createElement('span');
          label.textContent = name;
          b.appendChild(face); b.appendChild(label);
          b.onclick = function () { pickStudent(name); };
          box.appendChild(b);
        });
        show('names');
      })
      .catch(function () {
        fail('No internet', 'Check the Wi-Fi, then tap OK to try again.', 'loading');
        $('btn-err').onclick = loadRoster;
      });
  }

  function pickStudent(name) {
    state.student = name;
    $('p-emoji').textContent = state.prompt.emoji;
    $('p-text').textContent = state.prompt.text;
    resetRecordScreen();
    show('record');
  }

  /* ---------- read the question aloud ---------- */
  $('btn-hear').onclick = function () {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(state.prompt.text);
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  };

  /* ---------- recording ---------- */
  function pickType() {
    if (!window.MediaRecorder) return '';
    var types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
    for (var i = 0; i < types.length; i++) {
      if (MediaRecorder.isTypeSupported(types[i])) return types[i];
    }
    return '';
  }

  function resetRecordScreen() {
    $('btn-rec').classList.remove('live');
    $('rec-label').textContent = 'Record';
    $('btn-rec').setAttribute('aria-label', 'Start recording');
    $('bar').style.width = '0%';
    $('btn-rec').disabled = false;
  }

  function releaseMic() {
    if (state.stream) { state.stream.getTracks().forEach(function (t) { t.stop(); }); state.stream = null; }
  }

  function startRecording() {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      return fail('Cannot record', 'This iPad needs to be updated to record. Ask your teacher.', 'record');
    }
    window.speechSynthesis && window.speechSynthesis.cancel();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      state.stream = stream;
      var type = pickType();
      state.recorder = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream);
      state.chunks = [];
      state.recorder.ondataavailable = function (e) { if (e.data && e.data.size) state.chunks.push(e.data); };
      state.recorder.onstop = function () {
        clearInterval(state.tick);
        releaseMic();
        state.mime = state.recorder.mimeType || type || 'audio/mp4';
        state.blob = new Blob(state.chunks, { type: state.mime });
        if (state.blob.size < 1000) {
          resetRecordScreen();
          return fail('Try again', 'We did not hear anything. Tap the red button and talk.', 'record');
        }
        if (state.previewUrl) URL.revokeObjectURL(state.previewUrl);
        state.previewUrl = URL.createObjectURL(state.blob);
        $('player').src = state.previewUrl;
        $('btn-play').textContent = '▶ Listen';
        show('review');
      };
      state.recorder.start();
      state.secs = 0;
      $('btn-rec').classList.add('live');
      $('rec-label').textContent = 'Stop';
      $('btn-rec').setAttribute('aria-label', 'Stop recording');
      state.tick = setInterval(function () {
        state.secs += 0.25;
        $('bar').style.width = Math.min(100, (state.secs / MAX_SECONDS) * 100) + '%';
        if (state.secs >= MAX_SECONDS) stopRecording();
      }, 250);
    }).catch(function () {
      fail('Microphone is off', 'Tap Allow when the iPad asks to use the microphone. Ask your teacher if it does not ask.', 'record');
    });
  }

  function stopRecording() {
    if (state.recorder && state.recorder.state === 'recording') state.recorder.stop();
  }

  $('btn-rec').onclick = function () {
    if (state.recorder && state.recorder.state === 'recording') stopRecording();
    else startRecording();
  };

  $('btn-back1').onclick = function () { show('names'); };

  /* ---------- review ---------- */
  var player = $('player');
  $('btn-play').onclick = function () {
    if (player.paused) { player.currentTime = 0; player.play(); $('btn-play').textContent = '■ Stop'; }
    else { player.pause(); $('btn-play').textContent = '▶ Listen'; }
  };
  player.onended = function () { $('btn-play').textContent = '▶ Listen'; };

  $('btn-retry').onclick = function () {
    player.pause();
    state.blob = null;
    resetRecordScreen();
    show('record');
  };

  /* ---------- send ---------- */
  function toBase64(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(',')[1]); };
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  $('btn-send').onclick = function () {
    player.pause();
    show('sending');
    toBase64(state.blob).then(function (b64) {
      return fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a browser preflight
        body: JSON.stringify({ classCode: classCode, student: state.student, mimeType: state.mime, audio: b64 })
      });
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error || 'failed');
      state.blob = null;
      $('done-name').textContent = 'Great job, ' + state.student + '!';
      show('done');
      setTimeout(function () { show('names'); }, 4000);
    })
    .catch(function () {
      // The recording is kept, so the child can just tap Send again.
      fail('Did not send', 'Your voice is still saved here. Check the Wi-Fi, then tap OK and send again.', 'review');
    });
  };

  loadRoster();
})();
</script>
</body>
</html>
